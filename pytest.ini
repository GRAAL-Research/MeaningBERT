[pytest]
addopts = --cov ./src --cov-report html --cov-report xml --cov-config=.coveragerc
testpaths = tests
# Les modules vivent sous src/ sans etre installes en mode paquet, donc un
# `pytest` nu ne les trouve pas : la CI echouait a la collecte sur
# "No module named 'data'" depuis que les tests existent. Le declarer ici evite
# aussi d'avoir a se souvenir de PYTHONPATH=src sur le poste.
pythonpath = src
